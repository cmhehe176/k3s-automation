---
- name: Uninstall MinIO S3 Object Storage from K3s
  hosts: k3s_control[0]
  become: yes
  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Delete MinIO namespace and all associated resources
      command: kubectl delete namespace {{ minio_namespace }} --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: delete_ns
      failed_when: false
      changed_when: delete_ns.rc == 0

    - name: Display uninstallation status
      debug:
        msg: "MinIO uninstalled successfully from namespace '{{ minio_namespace }}'."
