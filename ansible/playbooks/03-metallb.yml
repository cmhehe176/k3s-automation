---
- name: Deploy MetalLB LoadBalancer
  hosts: k3s_control[0]
  gather_facts: no

  tasks:
    - name: Apply MetalLB manifest
      command: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.8/config/manifests/metallb-native.yaml
      changed_when: true

    - name: Wait for MetalLB pods to be ready
      command: kubectl wait --namespace metallb-system --for=condition=ready pod --selector=app=metallb --timeout=300s
      changed_when: false

    - name: Create MetalLB IPAddressPool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
              - "{{ metallb_ip_range }}"

    - name: Create MetalLB L2Advertisement
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
              - default-pool

    - name: Display MetalLB status
      command: kubectl get pods -n metallb-system
      register: metallb_pods
      changed_when: false

    - name: Show MetalLB pods
      debug:
        var: metallb_pods.stdout_lines
