---
# ==============================================================================
# 🌐 GLOBAL CONFIGURATION & COMPONENT VERSIONS
# ==============================================================================

# Component Versions
k3s_version: v1.30.3+k3s1
metallb_version: v0.14.8
longhorn_version: v1.7.1
argocd_version: v2.12.0

# Network Configuration
cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16
cluster_dns: 10.43.0.10

# System Settings
system_timezone: Asia/Ho_Chi_Minh

# MetalLB Configuration (250 IP dải riêng 10.200.10.x - hoàn toàn tách biệt khỏi LAN và Tailscale)
metallb_ip_range: 10.200.10.1-10.200.10.250

# Global Kubeconfig Path
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
