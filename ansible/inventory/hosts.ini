# K3s Cluster Inventory
# Update IPs and username according to your environment

# === CONTROL PLANE ===
[k3s_control]
node-1 ansible_host=192.168.1.237 ansible_user=mbfs

# === WORKERS ===
# Add your worker nodes here
[k3s_workers]
node-2 ansible_host=192.168.1.128 ansible_user=mbfs
# node-3 ansible_host=192.168.1.X ansible_user=username
# node-4 ansible_host=192.168.1.X ansible_user=username

# === MIDDLEWARE ===
# Standalone middleware nodes (not joining K3s)
[middleware]
# node-5 ansible_host=192.168.1.X ansible_user=username

# === GROUP DEFINITIONS (DO NOT MODIFY) ===
[k3s_cluster:children]
k3s_control
k3s_workers

# === GLOBAL VARIABLES ===
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
