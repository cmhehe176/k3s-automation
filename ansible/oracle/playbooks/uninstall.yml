---
- name: Uninstall Oracle Database from K3s
  hosts: k3s_control[0]
  become: yes
  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Delete Oracle namespace and all associated resources
      command: kubectl delete namespace {{ oracle_namespace }} --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: delete_ns
      failed_when: false
      changed_when: delete_ns.rc == 0

    - name: Display uninstallation status
      debug:
        msg: "Oracle Database uninstalled successfully from namespace '{{ oracle_namespace }}'."
