---
- name: Uninstall Redis Cluster from K3s
  hosts: k3s_control[0]
  become: yes
  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Delete Redis namespace and all associated resources
      command: kubectl delete namespace {{ redis_namespace }} --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: delete_ns
      failed_when: false
      changed_when: delete_ns.rc == 0

    - name: Display uninstallation status
      debug:
        msg: "Redis Cluster uninstalled successfully from namespace '{{ redis_namespace }}'."
