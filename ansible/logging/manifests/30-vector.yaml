apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
- apiGroups: [""]
  resources: ["namespaces", "nodes", "pods"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: logging
data:
  vector.yaml: |
    # Doc mat khau tu file k8s mount vao, khong hardcode trong ConfigMap
    secret:
      es:
        type: directory
        path: /etc/vector-secrets
    api:
      address: 0.0.0.0:8686
      enabled: true
    data_dir: /vector-data-dir
    sources:
      kubernetes_logs:
        type: kubernetes_logs
    transforms:
      merge_multiline:
        type: reduce
        inputs:
        - kubernetes_logs
        group_by:
        - file
        - kubernetes.pod_name
        merge_strategies:
          message: concat_newline
        starts_when: |
          .message != null && match(string!(.message), r'^\d{4}[-/]\d{2}[-/]\d{2}|^\[\d{4}')
      filter_and_keep_fields:
        type: remap
        inputs:
        - merge_multiline
        source: |
          # 1. Loc theo namespace ung dung
          if .kubernetes.pod_namespace != "hn1-vdc-prod-core-backend-thanhtoantaptrung" && .kubernetes.pod_namespace != "hn1-vdc-prod-dmz-frontend-thanhtoantaptrung" {
            abort
          }

          # 2. Xu ly @timestamp an toan
          if .timestamp != null {
            .@timestamp = .timestamp
          } else {
            .@timestamp = now()
          }

          # 3. Lam sach ma mau ANSI
          clean_message = strip_ansi_escape_codes(string!(.message))

          # 4. Trich xuat level
          level = ""
          parsed_f1, err1 = parse_regex(clean_message, r'(?s)^\d{4}[-/]\d{2}[-/]\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?\s+(?P<level>[A-Z]+)\s+')
          if err1 == null {
            level = parsed_f1.level
          } else {
            parsed_f2, err2 = parse_regex(clean_message, r'(?s)^\[\d{4}[-/]\d{2}[-/]\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?\]\s+(?P<level>[A-Z]+)\s+')
            if err2 == null {
              level = parsed_f2.level
            }
          }

          # 5. Trich xuat traceId
          trace_id = ""
          req_match, err_req = parse_regex(clean_message, r'"(?:requestId|traceId)"\s*:\s*"(?P<id>[^"]+)"')
          if err_req == null {
            trace_id = req_match.id
          } else {
            uuid_match, err_uuid = parse_regex(clean_message, r'(?P<id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})')
            if err_uuid == null {
              trace_id = uuid_match.id
            }
          }

          # 6. Cat timestamp o dau message
          clean_message = replace(clean_message, r'^\[?\d{4}[-/]\d{2}[-/]\d{2}[\sT]\d{2}:\d{2}:\d{2}(?:\.\d+)?\]?\s*', "")

          # 6b. Xac dinh service: uu tien label "service", fallback app.kubernetes.io/name
          svc = .kubernetes.pod_labels.service
          if svc == null {
            svc = .kubernetes.pod_labels."app.kubernetes.io/name"
          }

          # 7. Re-structure
          . = {
            "level": level,
            "traceId": trace_id,
            "message": clean_message,
            "service": svc,
            "pod": .kubernetes.pod_name,
            "container": .kubernetes.container_name,
            "namespace": .kubernetes.pod_namespace,
            "@timestamp": .@timestamp
          }

          compact(.)
    sinks:
      elasticsearch_sink:
        type: elasticsearch
        inputs:
        - filter_and_keep_fields
        api_version: v8
        endpoints:
        - https://elasticsearch-es-http.logging.svc:9200
        auth:
          strategy: basic
          user: elastic
          password: SECRET[es.elastic]
        tls:
          verify_certificate: false
        bulk:
          action: index
          index: k8s-app-%Y.%m.%d
        compression: gzip
        batch:
          max_bytes: 10485760
          timeout_secs: 5
        buffer:
          type: memory
          max_events: 500
          when_full: drop_newest
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
      annotations:
        checksum/config: "v3"
    spec:
      serviceAccountName: vector
      tolerations:
      - operator: Exists
      containers:
      - name: vector
        image: docker.io/timberio/vector:0.57.0-distroless-libc
        args: ["--config-dir", "/etc/vector/"]
        env:
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VECTOR_SELF_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VECTOR_SELF_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: api
          containerPort: 8686
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/vector/
          readOnly: true
        - name: es-creds
          mountPath: /etc/vector-secrets/elastic
          subPath: elastic
          readOnly: true
        - name: data
          mountPath: /vector-data-dir
        - name: var-log
          mountPath: /var/log/
          readOnly: true
        - name: var-lib
          mountPath: /var/lib/
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector
      - name: es-creds
        secret:
          secretName: elasticsearch-es-elastic-user
      - name: data
        hostPath:
          path: /var/lib/vector
          type: DirectoryOrCreate
      - name: var-log
        hostPath:
          path: /var/log/
      - name: var-lib
        hostPath:
          path: /var/lib/
