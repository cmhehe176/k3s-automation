apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
  annotations:
    eck.k8s.elastic.co/license: basic
spec:
  version: 9.5.0
  nodeSets:
  - name: elasticsearch-data
    count: 1
    config:
      node.store.allow_mmap: false
    podTemplate:
      spec:
        # 3 pod / 2 node: uu tien trai deu, khong bat buoc (soft anti-affinity)
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    elasticsearch.k8s.elastic.co/cluster-name: elasticsearch
        containers:
        - name: elasticsearch
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 40Gi
        storageClassName: longhorn-es
