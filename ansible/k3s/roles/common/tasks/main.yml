---
- name: Install base packages (Debian family)
  apt:
    name: "{{ common_packages_debian }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  ignore_errors: yes

- name: Install base packages (RHEL 7 / CentOS 7)
  command: "yum install -y {{ common_packages_el7 | join(' ') }}"
  when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution_major_version'] == "7"
  ignore_errors: yes
  changed_when: false

- name: Install base packages (RedHat/Fedora 8+ family)
  dnf:
    name: "{{ common_packages_redhat }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution_major_version'] != "7"

- name: Set system timezone
  timezone:
    name: "{{ system_timezone }}"
  when: system_timezone is defined

- name: Disable swap immediately
  command: swapoff -a
  changed_when: false

- name: Disable swap permanently in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules on boot
  copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Configure sysctl settings for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k3s.conf
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

- name: Start and enable iscsid service (for Longhorn)
  systemd:
    name: iscsid
    state: started
    enabled: yes
  ignore_errors: yes

- name: Check if firewalld is active
  command: systemctl is-active firewalld
  register: firewalld_status
  failed_when: false
  changed_when: false

- name: Allow K3s ports in firewalld
  firewalld:
    port: "{{ item.port }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ k3s_firewall_ports }}"
  when: firewalld_status.rc == 0
  ignore_errors: yes

- name: Check if ufw is active
  command: ufw status
  register: ufw_status
  failed_when: false
  changed_when: false

- name: Allow K3s ports in ufw
  ufw:
    rule: allow
    port: "{{ item.port.split('/')[0] }}"
    proto: "{{ item.port.split('/')[1] }}"
  loop: "{{ k3s_firewall_ports }}"
  when:
    - ufw_status.stdout is defined
    - "'Status: active' in ufw_status.stdout"
  ignore_errors: yes
