---
- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s installation script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Install K3s server
  shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_TOKEN="{{ k3s_token }}" \
    sh /tmp/k3s-install.sh server \
    {{ k3s_server_args | join(' ') }}
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_SKIP_START: "false"

- name: Wait for K3s to be ready
  wait_for:
    port: 6443
    delay: 5
    timeout: 300

- name: Create kubectl symlink
  file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Set kubeconfig permissions
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0600'
    owner: root
    group: root

- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copy kubeconfig to root
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'

- name: Get node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token

- name: Save token locally (encrypted)
  copy:
    content: "{{ node_token.content | b64decode }}"
    dest: "{{ playbook_dir }}/../.vault/k3s-node-token"
    mode: '0600'
  delegate_to: localhost
  become: no
  no_log: true

- name: Encrypt token with ansible-vault
  command: ansible-vault encrypt "{{ playbook_dir }}/../.vault/k3s-node-token"
  delegate_to: localhost
  become: no
  when: ansible_vault_password_file is defined or lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE') != ''
  ignore_errors: yes

- name: Fetch kubeconfig to local machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/.kube/config-k3s
    flat: yes

- name: Update kubeconfig server address
  replace:
    path: ~/.kube/config-k3s
    regexp: 'https://127.0.0.1:6443'
    replace: 'https://{{ ansible_host }}:6443'
  delegate_to: localhost
  become: no
