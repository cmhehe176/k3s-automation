---
k3s_version: v1.30.3+k3s1
k3s_token: "{{ lookup('env', 'K3S_TOKEN') | default('k3s-cluster-secret-token', true) }}"
k3s_cluster_cidr: "{{ cluster_cidr | default('10.42.0.0/16') }}"
k3s_service_cidr: "{{ service_cidr | default('10.43.0.0/16') }}"
k3s_cluster_dns: "{{ cluster_dns | default('10.43.0.10') }}"
k3s_write_kubeconfig_mode: "0644"
k3s_disable_components:
  - traefik
  - servicelb
k3s_tls_san:
  - "{{ ansible_host }}"
  - "{{ inventory_hostname }}"
k3s_extra_server_args: []
