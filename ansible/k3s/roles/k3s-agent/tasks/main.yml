---
- name: Check if K3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Check if K3s token exists locally
  stat:
    path: /tmp/k3s-node-token
  delegate_to: localhost
  register: token_file
  become: no

- name: Fail if token not found
  fail:
    msg: |
      K3s token not found at /tmp/k3s-node-token!

      Make sure control plane is already deployed:
        cd ansible/
        ./bootstrap.sh

      Or re-run: ansible-playbook playbooks/01-k3s-control.yml
  when: not token_file.stat.exists

- name: Read K3s token from local file
  set_fact:
    k3s_node_token: "{{ lookup('file', '/tmp/k3s-node-token') }}"

- name: Set K3s server URL
  set_fact:
    k3s_url: "https://{{ hostvars[groups['k3s_control'][0]]['ansible_host'] }}:6443"

- name: Download K3s installation script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_agent_binary.stat.exists

- name: Install K3s agent
  shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_URL="{{ k3s_url }}" \
    K3S_TOKEN="{{ k3s_node_token }}" \
    sh /tmp/k3s-install.sh agent \
    {{ k3s_agent_args | join(' ') }}
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_SKIP_START: "false"

- name: Wait for agent to register
  pause:
    seconds: 10
