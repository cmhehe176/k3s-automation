---
- name: Chuẩn bị nodes cho K3s cluster
  hosts: k3s_cluster
  gather_facts: yes
  become: yes
  roles:
    - common

  post_tasks:
    - name: Display node information
      debug:
        msg: "Configured {{ inventory_hostname }} ({{ ansible_host }}) - {{ ansible_distribution }} {{ ansible_distribution_version }}"
