---
- name: Deploy MetalLB LoadBalancer
  hosts: k3s_control[0]
  gather_facts: no
  become: yes

  tasks:
    - name: Copy bundled local MetalLB manifest
      copy:
        src: ../manifests/metallb-v0.14.8.yaml
        dest: /tmp/metallb.yaml
        mode: '0644'

    - name: Apply MetalLB manifest
      command: kubectl apply -f /tmp/metallb.yaml
      changed_when: true

    - name: Wait for MetalLB pods to exist
      command: kubectl get pods -n {{ metallb_namespace | default('metallb-system') }} -l app=metallb -o jsonpath='{.items[0].metadata.name}'
      register: metallb_pods_exist
      retries: 30
      delay: 3
      until: metallb_pods_exist.rc == 0 and metallb_pods_exist.stdout != ""
      changed_when: false

    - name: Wait for MetalLB pods to be ready
      command: kubectl wait --namespace {{ metallb_namespace | default('metallb-system') }} --for=condition=ready pod --selector=app=metallb --timeout=300s
      register: metallb_ready
      retries: 30
      delay: 3
      until: metallb_ready.rc == 0
      changed_when: false

    - name: Apply MetalLB IPAddressPool and L2Advertisement
      shell: |
        cat << 'EOF' | kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: {{ metallb_namespace | default('metallb-system') }}
        spec:
          addresses:
            - {{ metallb_ip_range }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default
          namespace: {{ metallb_namespace | default('metallb-system') }}
        spec:
          ipAddressPools:
            - default-pool
        EOF
      register: metallb_pool_result
      retries: 15
      delay: 5
      until: metallb_pool_result.rc == 0
    - name: Scale MetalLB Controller for HA and set resource requests/limits
      shell: |
        kubectl scale deployment controller -n {{ metallb_namespace | default('metallb-system') }} --replicas=2
        kubectl set resources deployment/controller -n {{ metallb_namespace | default('metallb-system') }} -c controller --requests=cpu=50m,memory=64Mi --limits=cpu=200m,memory=256Mi
        kubectl set resources daemonset/speaker -n {{ metallb_namespace | default('metallb-system') }} -c speaker --requests=cpu=50m,memory=64Mi --limits=cpu=200m,memory=256Mi
      changed_when: true

    - name: Display MetalLB status
      command: kubectl get pods -n metallb-system
      register: metallb_pods
      changed_when: false

    - name: Show MetalLB pods
      debug:
        var: metallb_pods.stdout_lines
