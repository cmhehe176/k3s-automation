---
- name: Uninstall K3s từ tất cả nodes
  hosts: k3s_cluster
  gather_facts: no
  become: yes

  tasks:
    - name: Stop K3s service (control plane)
      systemd:
        name: k3s
        state: stopped
      when: "'k3s_control' in group_names"
      ignore_errors: yes

    - name: Stop K3s agent service (workers)
      systemd:
        name: k3s-agent
        state: stopped
      when: "'k3s_workers' in group_names"
      ignore_errors: yes

    - name: Run K3s uninstall script (control plane)
      shell: /usr/local/bin/k3s-uninstall.sh
      when: "'k3s_control' in group_names"
      ignore_errors: yes

    - name: Run K3s agent uninstall script (workers)
      shell: /usr/local/bin/k3s-agent-uninstall.sh
      when: "'k3s_workers' in group_names"
      ignore_errors: yes

    - name: Remove K3s directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /var/lib/cni
        - /opt/cni
      ignore_errors: yes

    - name: Display cleanup status
      debug:
        msg: "K3s uninstalled from {{ inventory_hostname }}"
