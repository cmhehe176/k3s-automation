---
- name: Uninstall K3s từ tất cả nodes
  hosts: k3s_cluster
  gather_facts: no
  become: yes

  tasks:
    - name: Stop and disable K3s service (control plane)
      systemd:
        name: k3s
        state: stopped
        enabled: no
      when: "'k3s_control' in group_names"
      ignore_errors: yes

    - name: Stop and disable K3s agent service (workers)
      systemd:
        name: k3s-agent
        state: stopped
        enabled: no
      when: "'k3s_workers' in group_names"
      ignore_errors: yes

    - name: Kill any lingering containerd-shim and k3s processes
      shell: killall -9 -q k3s containerd-shim containerd-shim-runc-v2 k3s-killall.sh || true
      failed_when: false
      changed_when: false

    - name: Run K3s server uninstall script
      shell: timeout 60s /usr/local/bin/k3s-uninstall.sh || true
      when: "'k3s_control' in group_names"
      ignore_errors: yes

    - name: Run K3s agent uninstall script
      shell: timeout 60s /usr/local/bin/k3s-agent-uninstall.sh || true
      when: "'k3s_workers' in group_names"
      ignore_errors: yes

    - name: Kill any lingering containerd-shim and k3s processes
      shell: killall -9 -q k3s containerd-shim containerd-shim-runc-v2 || true
      failed_when: false
      changed_when: false

    - name: Remove K3s binaries, symlinks, and scripts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k3s
        - /usr/local/bin/k3s-killall.sh
        - /usr/local/bin/k3s-uninstall.sh
        - /usr/local/bin/k3s-agent-uninstall.sh
        - /usr/local/bin/kubectl
        - /usr/local/bin/crictl
        - /usr/local/bin/ctr
        - /tmp/k3s-install.sh
      ignore_errors: yes

    - name: Remove K3s systemd unit files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/k3s.service
        - /etc/systemd/system/k3s.service.env
        - /etc/systemd/system/k3s-agent.service
        - /etc/systemd/system/k3s-agent.service.env
      ignore_errors: yes

    - name: Unmount all active K3s and Containerd overlay mounts
      shell: |
        for m in $(tac /proc/mounts | awk '{print $2}' | grep -E '^/(var/lib/rancher|var/lib/kubelet|run/k3s|run/containerd)'); do
          umount -f -l "$m" 2>/dev/null || true
        done
      failed_when: false
      changed_when: false

    - name: Remove K3s, Longhorn data directories and temporary manifests
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /var/lib/cni
        - /opt/cni
        - /root/.kube
        - /var/lib/longhorn
        - /tmp/oracle
        - /tmp/redis
        - /tmp/redpanda
        - /tmp/minio
        - /tmp/openshift-console
        - /tmp/kubesphere
        - /tmp/argocd
      ignore_errors: yes

    - name: Clean up leftover network interfaces
      shell: ip link show {{ item }} >/dev/null 2>&1 && ip link delete {{ item }} || true
      loop:
        - cni0
        - flannel.1
        - flannel-v6.1
        - kube-ipvs0
      failed_when: false
      changed_when: false

    - name: Flush K3s-specific iptables chains only (preserve system rules)
      shell: |
        # Only delete K3s/CNI-specific chains, NEVER flush the entire ruleset
        for chain in $(iptables -L -n 2>/dev/null | grep -oE '^Chain (KUBE-|CNI-|FLANNEL)[^ ]+' | awk '{print $2}'); do
          iptables -F "$chain" 2>/dev/null || true
          iptables -X "$chain" 2>/dev/null || true
        done
        for chain in $(iptables -t nat -L -n 2>/dev/null | grep -oE '^Chain (KUBE-|CNI-|FLANNEL)[^ ]+' | awk '{print $2}'); do
          iptables -t nat -F "$chain" 2>/dev/null || true
          iptables -t nat -X "$chain" 2>/dev/null || true
        done
      failed_when: false
      changed_when: false

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      ignore_errors: yes

    - name: Display cleanup status
      debug:
        msg: "K3s uninstalled completely from {{ inventory_hostname }}"

- name: Clean up local tokens and kubeconfig from control machine
  hosts: localhost
  gather_facts: no
  become: no
  tasks:
    - name: Remove cached local tokens and kubeconfigs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - ~/.kube/config-k3s
        - "{{ inventory_dir }}/../.vault/cluster-token"
        - "{{ inventory_dir }}/../.vault/k3s-node-token"
        - /tmp/k3s-node-token
      ignore_errors: yes
