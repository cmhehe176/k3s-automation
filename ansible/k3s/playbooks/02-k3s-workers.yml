---
- name: Cài K3s Workers
  hosts: k3s_workers
  gather_facts: yes
  become: yes
  roles:
    - k3s-agent

- name: Verify cluster nodes
  hosts: k3s_control[0]
  gather_facts: no
  become: yes
  tasks:
    - name: Get all nodes
      command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: all_nodes
      changed_when: false

    - name: Display all nodes
      debug:
        var: all_nodes.stdout_lines
