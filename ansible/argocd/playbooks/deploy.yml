---
- name: Deploy ArgoCD
  hosts: k3s_control[0]
  gather_facts: no
  become: yes

  vars:
    argocd_namespace: "argocd"

  tasks:
    - name: Create ArgoCD namespace
      command: kubectl create namespace {{ argocd_namespace }}
      register: ns_create
      failed_when: ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr
      changed_when: ns_create.rc == 0

    - name: Attempt to fetch ArgoCD manifest from remote mirrors
      shell: |
        curl -fsSL --connect-timeout 10 --max-time 30 "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml" -o /tmp/argocd-install.yaml || \
        curl -fsSL --connect-timeout 10 --max-time 30 "https://cdn.jsdelivr.net/gh/argoproj/argo-cd@{{ argocd_version }}/manifests/install.yaml" -o /tmp/argocd-install.yaml || true
      register: download_result
      changed_when: false

    - name: Check if downloaded ArgoCD manifest is valid
      stat:
        path: /tmp/argocd-install.yaml
      register: manifest_file

    - name: Fallback to bundled local ArgoCD manifest if remote download failed
      copy:
        src: ../manifests/argocd-v2.12.0.yaml
        dest: /tmp/argocd-install.yaml
        mode: '0644'
      when: not manifest_file.stat.exists or (manifest_file.stat.size | default(0)) < 10000

    - name: Apply ArgoCD manifest
      command: kubectl apply -n {{ argocd_namespace }} -f /tmp/argocd-install.yaml
      changed_when: true

    - name: Wait for ArgoCD pods to be created
      command: kubectl get pods -n {{ argocd_namespace }}
      register: pods_check
      retries: 30
      delay: 5
      until: pods_check.stdout_lines | length > 1
      changed_when: false

    - name: Wait for ArgoCD server deployment
      command: kubectl wait --namespace {{ argocd_namespace }} --for=condition=Available deployment/argocd-server --timeout=600s
      register: server_ready
      retries: 2
      delay: 30
      until: server_ready.rc == 0
      changed_when: false

    - name: Wait for all ArgoCD pods to be ready
      command: kubectl wait --namespace {{ argocd_namespace }} --for=condition=ready pod --all --timeout=600s
      register: pods_ready
      changed_when: false
      ignore_errors: yes

    - name: Get ArgoCD server service
      command: kubectl get svc argocd-server -n {{ argocd_namespace }}
      register: argocd_svc
      changed_when: false

    - name: Display ArgoCD service
      debug:
        var: argocd_svc.stdout_lines

    - name: Patch ArgoCD server to use LoadBalancer
      command: kubectl patch svc argocd-server -n {{ argocd_namespace }} -p '{"spec":{"type":"LoadBalancer"}}'
      changed_when: true

    - name: Wait for LoadBalancer IP
      shell: kubectl get svc argocd-server -n {{ argocd_namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: lb_ip
      retries: 30
      delay: 5
      until: lb_ip.stdout != ""
      changed_when: false
      ignore_errors: yes

    - name: Generate bcrypt hash for ArgoCD admin password
      shell: |
        PWD_VAL="{{ argocd_admin_password | default('Admin@2026') }}"
        if [ "$PWD_VAL" = "Admin@2026" ]; then
          echo '$2a$10$YV5Xp8FbXqTZ9fMZYUhrNObe2/oRVQB/.mWLkoXFNFu2/818hXOC2'
        else
          (htpasswd -bnBC 10 "" "$PWD_VAL" 2>/dev/null | tr -d ':\n' | sed 's/^\$2[by]\$/\$2a\$/') || \
          python3 -c "import bcrypt; print(bcrypt.hashpw(b'$PWD_VAL', bcrypt.gensalt(10)).decode('utf-8'))" 2>/dev/null || \
          echo '$2a$10$YV5Xp8FbXqTZ9fMZYUhrNObe2/oRVQB/.mWLkoXFNFu2/818hXOC2'
        fi
      register: argo_admin_hash
      changed_when: false

    - name: Patch ArgoCD secret with fixed admin password
      shell: |
        HASH_VAL='{{ argo_admin_hash.stdout | trim }}'
        HASH_B64=$(echo -n "$HASH_VAL" | base64 | tr -d '\n')
        MTIME_B64=$(date +%FT%T%Z | base64 | tr -d '\n')
        kubectl patch secret argocd-secret -n {{ argocd_namespace }} --type=merge -p "{\"data\": {\"admin.password\": \"$HASH_B64\", \"admin.passwordMtime\": \"$MTIME_B64\"}}"
        kubectl delete secret argocd-initial-admin-secret -n {{ argocd_namespace }} --ignore-not-found=true
        kubectl rollout restart deployment/argocd-server -n {{ argocd_namespace }}
      when: argo_admin_hash.stdout is defined and argo_admin_hash.stdout != ""

    - name: Wait for ArgoCD server rollout after password patch
      command: kubectl rollout status deployment/argocd-server -n {{ argocd_namespace }} --timeout=120s
      changed_when: false

    - name: Get ArgoCD pods status
      command: kubectl get pods -n {{ argocd_namespace }} -o wide
      register: argocd_pods
      changed_when: false

    - name: Display ArgoCD pods
      debug:
        var: argocd_pods.stdout_lines

    - name: Display ArgoCD access information
      debug:
        msg:
          - "=========================================="
          - "ArgoCD deployed successfully!"
          - "=========================================="
          - "Namespace: {{ argocd_namespace }}"
          - "Version: {{ argocd_version }}"
          - ""
          - "Access ArgoCD UI:"
          - "  URL: https://{{ lb_ip.stdout | default(ansible_host) }}:443"
          - "  Username: {{ argocd_admin_user | default('admin') }}"
          - "  Password: {{ argocd_admin_password | default('Admin@2026') }}"
          - ""
          - "CLI Login:"
          - "  argocd login {{ lb_ip.stdout | default(ansible_host) }}:443 --username admin --password '{{ argocd_admin_password | default('Admin@2026') }}' --insecure"
          - "=========================================="
